                        topics: ["MySQL HOME", "MySQL Intro", "MySQL SELECT", "MySQL WHERE", "MySQL JOINS"]
                    }
                ]
            }
        };

        // MOCK CONTENT ENGINE PROVIDING COMPREHENSIVE DETAILED LESSONS FOR EVERY TOPIC
        function getTopicContent(course, topicName) {
            const courseCodeSamples = {
                html: `<!DOCTYPE html>\n<html>\n<head>\n  <title>DevDocs Page</title>\n</head>\n<body>\n  <h1 style="color:#16a34a;">Hello World from ${topicName}!</h1>\n  <p>HTML is the foundation for web structure.</p>\n  <button onclick="alert('Button Clicked!')">Click Me</button>\n</body>\n</html>`,
                css: `/* CSS Styling Sample */\nbody {\n  font-family: Arial, sans-serif;\n  background-color: #f0fdf4;\n  padding: 20px;\n}\nh1 {\n  color: #15803d;\n  border-bottom: 2px solid #22c55e;\n}`,
                js: `// JavaScript Execution Example\nfunction calculateSum(a, b) {\n  return a + b;\n}\n\nconst result = calculateSum(15, 27);\nconsole.log("Calculated Sum: " + result);\n\ndocument.body.innerHTML = '<h2>JS Execution Result: ' + result + '</h2>';`,
                python: `# Python Program\ndef greet(name):\n    return f"Hello, {name}! Welcome to ${topicName}."\n\nmessage = greet("Developer")\nprint(message)\nprint("Calculated Square:", [x**2 for x in range(5)])`,
                java: `public class Main {\n    public static void main(String[] args) {\n        System.out.println("Executing Java Topic: ${topicName}");\n        int sum = 0;\n        for (int i = 1; i <= 5; i++) {\n            sum += i;\n        }\n        System.out.println("Sum of numbers 1 to 5: " + sum);\n    }\n}`,
                sql: `-- SQL Database Query Demonstration\nSELECT id, name, email, status\nFROM users\nWHERE status = 'active'\nORDER BY name ASC;`,
                cpp: `#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "Executing C++ Concept: ${topicName}" << endl;\n    return 0;\n}`,
                react: `// React Functional Component\nfunction App() {\n  const [count, setCount] = React.useState(0);\n  return (\n    <div style={{padding: '20px', textFont: 'sans-serif'}}>\n      <h2>React State Counter</h2>\n      <p>Current Count: {count}</p>\n      <button onClick={() => setCount(count + 1)}>Increment</button>\n    </div>\n  );\n}`
            };

            const sampleCode = courseCodeSamples[course] || `// Code snippet for ${topicName}\nconsole.log("Welcome to ${topicName}");`;

            return {
                title: topicName,
                subtitle: `In-depth breakdown and practical usage of ${topicName}.`,
                htmlContent: `
                    <p class="text-base leading-relaxed">
                        Welcome to the official <strong>${topicName}</strong> guide. In web development and software engineering, understanding ${topicName} provides key architectural advantages.
                    </p>
                    <div class="bg-brand-50 dark:bg-brand-900/30 border-l-4 border-brand-500 p-4 rounded-r-lg my-4">
                        <p class="text-sm font-semibold text-brand-900 dark:text-brand-300">
                            💡 Key takeaway: Always structure code cleanly, test edge cases, and maintain standards.
                        </p>
                    </div>
                    <h3 class="text-xl font-bold text-gray-800 dark:text-gray-100 mt-4 mb-2">Syntax & Implementation</h3>
                    <p class="text-sm">Below is a practical code representation showing how to execute this topic in real applications:</p>
                `,
                snippet: sampleCode,
                quiz: {
                    question: `What is the primary role of ${topicName} in programming?`,
                    options: [
                        `To structure and manage runtime behavior efficiently`,
                        `To replace hardware functionality`,
                        `To operate strictly on mainframe computers`,
                        `None of the above`
                    ],
                    correctIndex: 0,
                    explanation: `${topicName} provides standardized structures for runtime execution and code optimization.`
                }
            };
        }

        // STATE APP MANAGEMENT
        let currentState = {
            lang: 'EN',
            course: 'html',
            topic: 'HTML HOME',
            score: 0
        };

        // DOM ELEMENTS
        const sidebarContent = document.getElementById('sidebar-content');
        const topicTitle = document.getElementById('topic-title');
        const topicSubtitle = document.getElementById('topic-subtitle');
        const topicBody = document.getElementById('topic-body');
        const codeSnippetBox = document.getElementById('code-snippet-box');
        const bcCourse = document.getElementById('bc-course');
        const bcSection = document.getElementById('bc-section');
        const bcTopic = document.getElementById('bc-topic');
        const quizQuestion = document.getElementById('quiz-question');
        const quizOptions = document.getElementById('quiz-options');
        const quizFeedback = document.getElementById('quiz-feedback');
        const quizScore = document.getElementById('quiz-score');

        // SANDBOX DRAWER ELEMENTS
        const sandboxDrawer = document.getElementById('sandbox-drawer');
        const openSandboxBtn = document.getElementById('open-sandbox-btn');
        const launchEditorBtn = document.getElementById('launch-editor-btn');
        const closeSandboxBtn = document.getElementById('close-sandbox-btn');
        const runCodeBtn = document.getElementById('run-code-btn');
        const sandboxCodeInput = document.getElementById('sandbox-code-input');
        const sandboxIframe = document.getElementById('sandbox-iframe');
        const sandboxTerminal = document.getElementById('sandbox-terminal');
        const tabPreviewBtn = document.getElementById('tab-preview-btn');
        const tabConsoleBtn = document.getElementById('tab-console-btn');
        const editorLangTag = document.getElementById('editor-lang-tag');

        // RENDER SIDEBAR NAVIGATION
        function renderSidebar() {
            const courseData = curriculum[currentState.course];
            if (!courseData) return;

            sidebarContent.innerHTML = '';
            
            courseData.sections.forEach(section => {
                const groupEl = document.createElement('div');
                groupEl.className = 'space-y-1';
                
                const groupTitle = document.createElement('h3');
                groupTitle.className = 'text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider px-2 py-1';
                groupTitle.innerText = section.name;
                groupEl.appendChild(groupTitle);

                section.topics.forEach(topic => {
                    const btn = document.createElement('button');
                    const isActive = topic.toLowerCase() === currentState.topic.toLowerCase();
                    btn.className = `w-full text-left px-3 py-1.5 rounded-lg text-sm font-medium transition ${
                        isActive 
                            ? 'bg-brand-500 text-white font-semibold' 
                            : 'text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700'
                    }`;
                    btn.innerText = topic;
                    btn.onclick = () => {
                        currentState.topic = topic;
                        loadTopicData();
                        renderSidebar();
                        // Auto close mobile drawer if open
                        document.getElementById('sidebar').classList.add('-translate-x-full');
                    };
                    groupEl.appendChild(btn);
                });

                sidebarContent.appendChild(groupEl);
            });
        }

        // LOAD TOPIC CONTENT & QUIZ
        function loadTopicData() {
            const data = getTopicContent(currentState.course, currentState.topic);
            
            // Breadcrumbs
            bcCourse.innerText = currentState.course.toUpperCase();
            bcSection.innerText = "Tutorial";
            bcTopic.innerText = data.title;

            // Header & Body
            topicTitle.innerText = data.title;
            topicSubtitle.innerText = data.subtitle;
            topicBody.innerHTML = data.htmlContent;
            codeSnippetBox.innerText = data.snippet;

            // Code Editor Setup
            sandboxCodeInput.value = data.snippet;
            editorLangTag.innerText = currentState.course;

            // Quiz Render
            renderQuiz(data.quiz);
        }

        // RENDER QUIZ
        function renderQuiz(quiz) {
            quizQuestion.innerText = quiz.question;
            quizOptions.innerHTML = '';
            quizFeedback.className = 'hidden p-3 rounded-lg text-sm font-medium';

            quiz.options.forEach((opt, idx) => {
                const optBtn = document.createElement('button');
                optBtn.className = 'w-full text-left p-3 rounded-lg border border-gray-200 dark:border-gray-700 hover:border-brand-500 hover:bg-brand-50/50 dark:hover:bg-gray-700/50 text-sm font-medium transition flex items-start gap-2';
                optBtn.innerHTML = `<span class="font-bold text-brand-600">${String.fromCharCode(65 + idx)}.</span> <span>${opt}</span>`;
                
                optBtn.onclick = () => {
                    if (idx === quiz.correctIndex) {
                        quizFeedback.className = 'p-3 rounded-lg text-sm font-medium bg-green-100 text-green-800 dark:bg-green-900/50 dark:text-green-300';
                        quizFeedback.innerText = `${i18nData[currentState.lang].correctMsg} ${quiz.explanation}`;
                        currentState.score += 10;
                    } else {
                        quizFeedback.className = 'p-3 rounded-lg text-sm font-medium bg-red-100 text-red-800 dark:bg-red-900/50 dark:text-red-300';
                        quizFeedback.innerText = `${i18nData[currentState.lang].wrongMsg}`;
                    }
                    quizFeedback.classList.remove('hidden');
                    quizScore.innerText = `Score: ${currentState.score}`;
                };

                quizOptions.appendChild(optBtn);
            });
        }

        // EXECUTE RUN CODE IN PLAYGROUND
        function executeCode() {
            const code = sandboxCodeInput.value;
            const course = currentState.course;

            if (['html', 'css', 'js', 'react'].includes(course)) {
                // Show Iframe
                sandboxIframe.classList.remove('hidden');
                sandboxTerminal.classList.add('hidden');

                let frameDoc = sandboxIframe.contentDocument || sandboxIframe.contentWindow.document;
                frameDoc.open();
                if (course === 'react') {
                    frameDoc.write(`
                        <!DOCTYPE html>
                        <html>
                        <head>
                            <script src="https://unpkg.com/react@18/umd/react.development.js"><\/script>
                            <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"><\/script>
                            <script src="https://unpkg.com/@babel/standalone/babel.min.js"><\/script>
                            <script src="https://cdn.tailwindcss.com"><\/script>
                        </head>
                        <body class="p-4">
                            <div id="root"></div>
                            <script type="text/babel">
                                ${code}
                                const container = document.getElementById('root');
                                const root = ReactDOM.createRoot(container);
                                root.render(<App />);
                            <\/script>
                        </body>
                        </html>
                    `);
                } else {
                    frameDoc.write(code);
                }
                frameDoc.close();
            } else {
                // Terminal output simulation for C, C++, Java, Python, SQL, PHP
                sandboxIframe.classList.add('hidden');
                sandboxTerminal.classList.remove('hidden');

                sandboxTerminal.innerText = `[DevDocs Virtual Engine: Running ${course.toUpperCase()} Script...]\n\n`;
                setTimeout(() => {
                    if (course === 'python') {
                        sandboxTerminal.innerText += `>>> Executing python main.py...\nHello, Developer! Welcome to ${currentState.topic}.\nCalculated Square: [0, 1, 4, 9, 16]\n\n[Process Finished with Code 0]`;
                    } else if (course === 'java' || course === 'c' || course === 'cpp') {
                        sandboxTerminal.innerText += `>>> Compiling binary targets...\n>>> Running compiled executable...\nExecuting ${currentState.topic} logic cleanly.\nSum of numbers 1 to 5: 15\n\n[Process Finished with Exit Status 0]`;
                    } else if (course === 'sql' || course === 'mysql') {
                        sandboxTerminal.innerText += `>>> Connecting to local relational database sandbox...\n>>> Query Result:\n+----+-------------------+---------------------+--------+\n| id | name              | email               | status |\n+----+-------------------+---------------------+--------+\n| 10 | Alex Johnson      | alex@devdocs.io     | active |\n| 14 | Maria Garcia      | maria@devdocs.io    | active |\n+----+-------------------+---------------------+--------+\n(2 rows returned in 0.003 sec)`;
                    } else {
                        sandboxTerminal.innerText += `>>> Output:\nExecution successful.\n\n[Process Completed]`;
                    }
                }, 300);
            }
        }

        // EVENT LISTENERS INITIALIZATION
        document.addEventListener('DOMContentLoaded', () => {
            // Course Bar Tab Click
            document.querySelectorAll('.course-tab').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    document.querySelectorAll('.course-tab').forEach(t => {
                        t.className = 'course-tab px-4 py-2.5 border-b-2 border-transparent hover:text-brand-600 text-gray-600 dark:text-gray-400 whitespace-nowrap';
                    });
                    e.target.className = 'course-tab px-4 py-2.5 border-b-2 border-brand-500 text-brand-600 dark:text-brand-400 whitespace-nowrap';
                    
                    currentState.course = e.target.getAttribute('data-course');
                    const firstSection = curriculum[currentState.course].sections[0];
                    currentState.topic = firstSection.topics[0];

                    renderSidebar();
                    loadTopicData();
                });
            });

            // Mobile Menu Toggle
            document.getElementById('mobile-menu-btn').addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('-translate-x-full');
            });

            // Dark/Light Theme Toggle
            document.getElementById('theme-toggle').addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
            });

            // Sandbox Drawer Open/Close
            const toggleDrawer = (show) => {
                if (show) {
                    sandboxDrawer.classList.remove('translate-x-full');
                    executeCode();
                } else {
                    sandboxDrawer.classList.add('translate-x-full');
                }
            };

            openSandboxBtn.addEventListener('click', () => toggleDrawer(true));
            launchEditorBtn.addEventListener('click', () => toggleDrawer(true));
            closeSandboxBtn.addEventListener('click', () => toggleDrawer(false));
            runCodeBtn.addEventListener('click', executeCode);

            // Sandbox Output Tabs
            tabPreviewBtn.addEventListener('click', () => {
                tabPreviewBtn.className = 'px-4 py-2 font-medium border-b-2 border-brand-500 text-white';
                tabConsoleBtn.className = 'px-4 py-2 font-medium border-b-2 border-transparent text-gray-400 hover:text-gray-200';
                sandboxIframe.classList.remove('hidden');
                sandboxTerminal.classList.add('hidden');
            });

            tabConsoleBtn.addEventListener('click', () => {
                tabConsoleBtn.className = 'px-4 py-2 font-medium border-b-2 border-brand-500 text-white';
                tabPreviewBtn.className = 'px-4 py-2 font-medium border-b-2 border-transparent text-gray-400 hover:text-gray-200';
                sandboxIframe.classList.add('hidden');
                sandboxTerminal.classList.remove('hidden');
            });

            // Language Selector Change
            document.getElementById('lang-selector').addEventListener('change', (e) => {
                currentState.lang = e.target.value;
                const dict = i18nData[currentState.lang];
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (dict[key]) el.innerText = dict[key];
                });
                loadTopicData();
            });

            // Global Search Bar Engine
            const searchInput = document.getElementById('global-search');
            const searchResults = document.getElementById('search-results');

            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                if (!query) {
                    searchResults.classList.add('hidden');
                    return;
                }

                searchResults.innerHTML = '';
                let matches = 0;

                Object.keys(curriculum).forEach(cKey => {
                    curriculum[cKey].sections.forEach(sec => {
                        sec.topics.forEach(top => {
                            if (top.toLowerCase().includes(query) && matches < 8) {
                                matches++;
                                const item = document.createElement('div');
                                item.className = 'px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 cursor-pointer rounded text-xs sm:text-sm flex justify-between items-center';
                                item.innerHTML = `<span class="font-medium text-gray-800 dark:text-gray-200">${top}</span> <span class="text-xs uppercase bg-brand-100 text-brand-800 dark:bg-brand-900 dark:text-brand-300 px-2 py-0.5 rounded">${cKey}</span>`;
                                item.onclick = () => {
                                    currentState.course = cKey;
                                    currentState.topic = top;
                                    
                                    // Highlight course tab
                                    document.querySelectorAll('.course-tab').forEach(t => {
                                        if (t.getAttribute('data-course') === cKey) {
                                            t.className = 'course-tab px-4 py-2.5 border-b-2 border-brand-500 text-brand-600 dark:text-brand-400 whitespace-nowrap';
                                        } else {
                                            t.className = 'course-tab px-4 py-2.5 border-b-2 border-transparent hover:text-brand-600 text-gray-600 dark:text-gray-400 whitespace-nowrap';
                                        }
                                    });

                                    renderSidebar();
                                    loadTopicData();
                                    searchResults.classList.add('hidden');
                                    searchInput.value = '';
                                };
                                searchResults.appendChild(item);
                            }
                        });
                    });
                });

                if (matches > 0) {
                    searchResults.classList.remove('hidden');
                } else {
                    searchResults.classList.add('hidden');
                }
            });

            // Initial Render
            renderSidebar();
            loadTopicData();
        });
    </script>
</body>
</html>
